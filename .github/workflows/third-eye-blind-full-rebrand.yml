name: Third Eye Blind full rebrand

on:
  push:
    paths:
      - '.github/workflows/third-eye-blind-full-rebrand.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Rebrand product-facing copy while preserving compatibility contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          TEXT_EXTS = {'.html', '.js', '.mjs', '.css', '.md', '.json', '.yml', '.yaml', '.txt'}
          SKIP_DIRS = {'.git', 'node_modules', 'dist', 'coverage'}
          SELF = '.github/workflows/third-eye-blind-full-rebrand.yml'
          PROTECTED_SCHEMA = 'src/voice/gevActions.js'

          replacements = [
              ("GOD'S EYE VIEW", "THIRD EYE BLIND"),
              ("God's Eye View", "Third Eye Blind"),
              ("god's eye view", "third eye blind"),
              ("GOD’S EYE VIEW", "THIRD EYE BLIND"),
              ("God’s Eye View", "Third Eye Blind"),
              ("god’s eye view", "third eye blind"),
              ("GOD\\'S EYE VIEW", "THIRD EYE BLIND"),
              ("God\\'s Eye View", "Third Eye Blind"),
              ("god\\'s eye view", "third eye blind"),
              ("<span>GOD'S EYE <span class=\"title-accent\">VIEW</span></span>", "<span>THIRD EYE <span class=\"title-accent\">BLIND</span></span>"),
              ("<h2>GOD'S EYE <span class=\"title-accent\">VIEW</span></h2>", "<h2>THIRD EYE <span class=\"title-accent\">BLIND</span></h2>"),
          ]
          gev_brand_files = {
              'index.html',
              'src/main.js',
              'src/ui.js',
              'src/voice/gevRealtime.js',
              'src/voice/gevRealtime.test.mjs',
          }

          changed = []
          for p in ROOT.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in TEXT_EXTS:
                  continue
              if any(part in SKIP_DIRS for part in p.parts):
                  continue
              path = p.as_posix()
              if path in {SELF, PROTECTED_SCHEMA}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              # Only product-facing runtime surfaces get the old display acronym
              # expanded. Internal gev/Gev namespaces and the pinned tool schema
              # are compatibility contracts and stay byte-stable.
              if path in gev_brand_files:
                  text = re.sub(r'\bGEV\b', 'Third Eye Blind', text)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(path)

          Path('/tmp/rebrand-changed-files.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('Changed files:')
          for path in changed:
              print(' -', path)
          if not changed:
              raise SystemExit('No legacy brand copy found; refusing empty rebrand commit')
          PY
      - name: Verify product-facing legacy branding is gone
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          protected = {'src/voice/gevActions.js', '.github/workflows/third-eye-blind-full-rebrand.yml'}
          hits = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              path = p.as_posix()
              if path in protected or p.suffix.lower() not in {'.html','.js','.mjs','.css','.md','.json','.yml','.yaml','.txt'}:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if re.search(r"God(?:\\?['’])s Eye View|GOD(?:\\?['’])S EYE VIEW", text):
                  hits.append(path)
          if hits:
              raise SystemExit('Legacy full product name remains in: ' + ', '.join(hits))

          display_files = ['index.html', 'src/main.js', 'src/ui.js', 'src/voice/gevRealtime.js']
          display_hits = []
          for path in display_files:
              text = Path(path).read_text(encoding='utf-8', errors='ignore')
              if re.search(r'\bGEV\b', text):
                  display_hits.append(path)
          if display_hits:
              raise SystemExit('Legacy display acronym remains in product-facing runtime files: ' + ', '.join(display_hits))
          print('Third Eye Blind product-facing brand scan: clean')
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Run setup policy checks
        run: npm run doctor -- --json
      - name: Run unit tests with diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/rebrand-test.log 2>&1
          status=$?
          cat /tmp/rebrand-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload rebrand diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-eye-blind-rebrand-diagnostics
          path: |
            /tmp/rebrand-test.log
            /tmp/rebrand-changed-files.txt
      - name: Enforce unit-test gate
        if: steps.tests.outputs.status != '0'
        run: exit 1
      - name: Build production bundle
        run: npm run build
      - name: Commit branding pass and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/third-eye-blind-full-rebrand.yml
          git add -A
          git diff --cached --check
          git commit -m "Rebrand app throughout as Third Eye Blind"
          git push
