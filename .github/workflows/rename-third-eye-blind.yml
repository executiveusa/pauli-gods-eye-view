name: Rename Third Eye Blind

on:
  push:
    paths:
      - '.github/workflows/rename-third-eye-blind.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename product title only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          before = s
          s = s.replace("<title>God's Eye View</title>", "<title>THIRD EYE BLIND</title>")
          s = s.replace("<span>GOD'S EYE <span class=\"title-accent\">VIEW</span></span>", "<span>THIRD EYE <span class=\"title-accent\">BLIND</span></span>")
          if s == before:
              raise SystemExit('Expected title strings not found; refusing broader changes')
          p.write_text(s)
          PY
      - name: Commit exact rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Rename hero to THIRD EYE BLIND"
          git push
